<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js",
          "three/addons/": "/vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      const bytesToBase64 = async (bytes) => {
        const blob = new Blob([bytes]);
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(blob);
        });
        return String(dataUrl).split(",")[1];
      };

      try {
        const { Compiler } = await import("/vendor/mindar-image.prod.js");
        const svgText = await (await fetch("/markers/centro.svg")).text();
        const svgUrl = URL.createObjectURL(
          new Blob([svgText], { type: "image/svg+xml" }),
        );
        const source = new Image();
        source.src = svgUrl;
        await source.decode();

        const canvas = document.createElement("canvas");
        canvas.width = 768;
        canvas.height = 768;
        const context = canvas.getContext("2d");
        context.drawImage(source, 0, 0, 768, 768);
        const pngBlob = await new Promise((resolve) =>
          canvas.toBlob(resolve, "image/png"),
        );
        const pngBytes = new Uint8Array(await pngBlob.arrayBuffer());

        const raster = new Image();
        raster.src = URL.createObjectURL(pngBlob);
        await raster.decode();

        const compiler = new Compiler();
        console.log("compilando features do brasão");
        await compiler.compileImageTargets([raster], (progress) => {
          console.log(`progresso ${Math.round(progress)}%`);
        });
        const exported = await compiler.exportData();
        const mindBytes =
          exported instanceof Uint8Array ? exported : new Uint8Array(exported);

        window.__result = {
          png: await bytesToBase64(pngBytes),
          mind: await bytesToBase64(mindBytes),
        };
        console.log("pronto");
      } catch (error) {
        window.__error = error instanceof Error ? error.stack ?? error.message : String(error);
        console.error(window.__error);
      }
    </script>
  </body>
</html>
